name: Deploy Github Pages.
on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Setup Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install packages
        run: npm ci
        working-directory: docs
      - name: Build the page
        run: npm run build
        working-directory: docs
      - name: Upload artifact for pages.
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/

  deploy-pages:
    needs: build  
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy pages
        id: deployment  
        uses: actions/deploy-pages@v4 
